# Kalponik: build the signed Android APK and attach it to a GitHub Release.
#
# How to release (see docs/DEPLOY.md, "Android release via GitHub"):
#   gh release create kalponik-v0.12.21 --target main --latest=false --title "Kalponik 0.12.21" --notes "..."
# --latest=false keeps GitHub's "latest" on the previous release while this
# one builds: the app and the invite page read .../releases/latest/download/,
# and a release with no files yet answers 404 there ("Error checking for
# updates"). The last step below marks it latest once everything is attached.
# A failed run leaves it unmarked, so phones stay on the last good release.
# The tag sets the app version (kalponik-vX.Y.Z -> X.Y.Z, and the Android
# versionCode Tauri derives from it), so no version-bump commit is needed and
# upstream merges never conflict on package.json. Each new tag must be higher
# than the last, or Android refuses to install the update.
#
# After the APK it attaches latest.json and release-notes.json, which the
# Android in-app updater reads through .../releases/latest/download/ (built by
# apps/kalponik-app/scripts/kalponik-release-manifest.mjs from the release list
# and each release's notes). Write release notes as one change per line.
#
# This is the only workflow here; upstream's are deleted to save Actions
# minutes. A published release builds, signs and attaches the APK.
#
# Caches: a release run's ref is its tag, and GitHub scopes caches to the ref,
# so caches saved by one release are invisible to the next. Release runs only
# read caches (Rust target dir, Gradle home, pnpm store); runs on main write
# them, and a release can read main's. Those main runs build the same unsigned
# APK and upload nothing: on a push to main that changes the Rust or Gradle
# dependencies or this file, weekly (GitHub drops caches unused for 7 days and
# stable Rust moves), or by hand from the Actions tab (workflow_dispatch,
# which is also how to test a change to this file without a release).
# Measured 2026-11-14 with no cache: 18-24 minutes, 11-15 of them Rust.
#
# Repository secrets it needs: KALPONIK_KEYSTORE_BASE64, KALPONIK_KEYSTORE_PASSWORD,
# KALPONIK_KEY_ALIAS, KALPONIK_SUPABASE_URL, KALPONIK_SUPABASE_ANON_KEY.

name: Kalponik Android release

on:
  release:
    types: [published]
  # The cache-warming runs (see above). They never touch a release.
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]
    paths:
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - 'apps/kalponik-app/src-tauri/gen/android/**/*.gradle*'
      - 'apps/kalponik-app/src-tauri/gen/android/gradle/**'
      - '.github/workflows/kalponik-android.yml'

permissions:
  contents: write

concurrency:
  group: kalponik-android-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_URL: https://asroy.duckdns.org/kalponik

jobs:
  apk:
    if: >-
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'kalponik-v'))
      || (github.event_name != 'release' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Read the version from the tag
        if: github.event_name == 'release'
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#kalponik-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like kalponik-vX.Y.Z, got $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize submodules (gstack is a dev-only skill, not needed)
        run: |
          git -c submodule."apps/readest-app/.claude/skills/gstack".update=none \
            submodule update --init --recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24
          package-manager-cache: false

      # Restored here, saved at the end only on main (setup-node's own cache
      # would also save from release runs, where nothing can read it back).
      - name: Find the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Restore the pnpm store
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: '17'

      # Gradle home (the Gradle distribution and Android/Kotlin dependencies).
      # 'basic' is the open-source GitHub Actions cache; the default 'enhanced'
      # is a commercial component.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools'

      - name: Install NDK
        run: sdkmanager "ndk;28.2.13676358"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          key: kalponik-android-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --prefer-offline
          pnpm --filter @kalponik/kalponik-app setup-vendors

      - name: Write .env.local (baked into the app)
        working-directory: apps/kalponik-app
        env:
          SUPABASE_URL: ${{ secrets.KALPONIK_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.KALPONIK_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "NEXT_PUBLIC_SELF_HOSTED=true"
            echo "NEXT_PUBLIC_API_BASE_URL=$PUBLIC_URL"
            echo "NEXT_PUBLIC_NODE_BASE_URL=$PUBLIC_URL"
          } > .env.local

      - name: Generate the Android project
        working-directory: apps/kalponik-app
        run: |
          # The way Readest's CI does it: regenerate, then restore the tracked
          # customisations (our applicationId, label and kalponik:// scheme).
          rm -rf src-tauri/gen/android
          pnpm tauri android init --ci
          git checkout -- src-tauri
          # Launcher icons come from the tracked set, not `tauri icon`: it has
          # the legacy square, the round icon and the adaptive icon with a
          # monochrome layer (Android 13+ themed icons). The tracked manifest
          # points roundIcon at ic_launcher_round.
          node scripts/copy-android-icons.mjs
          res=src-tauri/gen/android/app/src/main/res
          grep -q 'android:roundIcon="@mipmap/ic_launcher_round"' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          test -f "$res/mipmap-anydpi-v26/ic_launcher_round.xml"

      - name: Set the version from the tag
        if: github.event_name == 'release'
        working-directory: apps/kalponik-app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "const f='package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          grep '"version"' package.json

      - name: Install the signing key
        if: github.event_name == 'release'
        working-directory: apps/kalponik-app/src-tauri/gen/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KALPONIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KALPONIK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KALPONIK_KEY_ALIAS }}
        run: |
          base64 -d <<< "$KEYSTORE_BASE64" > "$RUNNER_TEMP/kalponik-release.jks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEYSTORE_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/kalponik-release.jks"
          } > keystore.properties

      - name: Build the APK
        working-directory: apps/kalponik-app
        timeout-minutes: 90
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: npx dotenv -e .env.tauri -- pnpm tauri android build --apk -t aarch64

      - name: Save the pnpm store (main only)
        if: github.ref == 'refs/heads/main' && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Attach the APK to the release
        if: github.event_name == 'release'
        working-directory: apps/kalponik-app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk="Kalponik_${VERSION}_arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$apk" | head -3
          ../../.github/scripts/retry.sh gh release upload "$TAG" "$apk" --clobber
          # A copy under a fixed name, so .../releases/latest/download/Kalponik_arm64.apk
          # (the invite page's download link) always gets the newest release.
          cp "$apk" Kalponik_arm64.apk
          ../../.github/scripts/retry.sh gh release upload "$TAG" Kalponik_arm64.apk --clobber

      # The in-app updater (Android) reads these two files from
      # .../releases/latest/download/, so they go up only after the APK is
      # attached: a phone never sees a version whose APK isn't there yet.
      # Plain JSON, no updater signing key: the stable Android path downloads
      # the APK and hands it to Android's installer, which checks that it is
      # signed with the same release key as the installed app.
      - name: Attach the update manifest (latest.json, release-notes.json)
        if: github.event_name == 'release'
        working-directory: apps/kalponik-app
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Each attempt rewrites the file, so a failed try leaves no partial list.
          ../../.github/scripts/retry.sh bash -c 'gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | {tag_name, published_at, created_at, body, draft, prerelease}" \
            > "$RUNNER_TEMP/releases.ndjson"'
          node scripts/kalponik-release-manifest.mjs \
            --version "$VERSION" \
            --apk-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/Kalponik_${VERSION}_arm64.apk" \
            --releases "$RUNNER_TEMP/releases.ndjson" \
            --out-dir "$RUNNER_TEMP/manifest"
          ../../.github/scripts/retry.sh gh release upload "$TAG" \
            "$RUNNER_TEMP/manifest/latest.json" "$RUNNER_TEMP/manifest/release-notes.json" --clobber

      # Only now, with the APK and both manifests attached, does
      # .../releases/latest/ move to this release (see the top of this file).
      - name: Mark the release as latest
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          .github/scripts/retry.sh gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
