# Same routes the production server block on asroy.duckdns.org will carry.

server {
    listen 80;
    server_name _;

    # Book files can be large (PDFs, CBZs).
    client_max_body_size 1g;

    # --- Book storage -------------------------------------------------------
    # The bucket name IS the path. Readest signs S3 URLs path-style against
    # S3_PUBLIC_ENDPOINT (https://host/<bucket>/<key>), and the signature
    # covers the Host header and the path. So nginx must forward the request
    # path untouched (proxy_pass with no URI part) and keep the original Host.
    location /kalponik-books/ {
        proxy_pass http://garage:3900;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_connect_timeout 300;
        chunked_transfer_encoding off;
    }

    # --- Readest web --------------------------------------------------------
    # Needs the fork's basePath patch (/kalponik). Path is passed unchanged.
    location /kalponik/ {
        proxy_pass http://host.docker.internal:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /kalponik {
        return 301 /kalponik/;
    }

    location = /healthz {
        return 200 "ok\n";
    }
}
