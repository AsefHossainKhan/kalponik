# Kalponik production stack: the web app + Garage (S3 book storage).
#
#   https://kalponik.example.com/                  -> web     (Next.js, at the root)
#   https://kalponik.example.com/kalponik-books/... -> garage  (S3 API, bucket = path)
#
# Auth + database are the hosted Supabase project. TLS and the public routes
# belong to your reverse proxy, which reaches these two containers by
# name over its Docker network (NGINX_PROXY_NETWORK); see nginx-vhost.conf
# and SELF-HOSTING.md. Both are also published on 127.0.0.1 for local checks.
#
# The web image is built on a PC (a Next.js build wants more memory than a
# small server has) and loaded with `docker load`; see build-web-image.sh.

name: kalponik

services:
  web:
    image: ${KALPONIK_WEB_IMAGE:-kalponik-web:latest}
    container_name: kalponik-web
    pull_policy: never
    restart: unless-stopped
    mem_limit: 1g
    ports:
      - "127.0.0.1:${KALPONIK_WEB_PORT:-47811}:3000"
    environment:
      # Read at runtime and handed to the browser through /runtime-config.js.
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set SUPABASE_ANON_KEY in .env}
      SUPABASE_ADMIN_KEY: ${SUPABASE_ADMIN_KEY:?set SUPABASE_ADMIN_KEY in .env}
      API_BASE_URL: ${KALPONIK_PUBLIC_ORIGIN:?set KALPONIK_PUBLIC_ORIGIN in .env}
      # Server-side S3 calls go straight to Garage; presigned URLs handed to
      # browsers and the app are signed against the public origin, where
      # nginx forwards /kalponik-books/... unchanged.
      S3_ENDPOINT: http://garage:3900
      S3_PUBLIC_ENDPOINT: ${KALPONIK_PUBLIC_ORIGIN}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-kalponik-books}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      OBJECT_STORAGE_TYPE: s3
      SELF_HOSTED: "true"
      STORAGE_FIXED_QUOTA: ${STORAGE_FIXED_QUOTA:-107374182400}
      # Invite-only sign-up: the root admin(s), who can always open /admin
      # (comma-separated emails or user ids). More admins are added in the app.
      KALPONIK_ADMINS: ${KALPONIK_ADMINS:?set KALPONIK_ADMINS in .env}
      # Email for sign-up (verification links, "your account is ready",
      # admin notices), e.g. Gmail with an app password; SELF-HOSTING.md.
      # Empty: no email is sent and addresses are taken as given.
      KALPONIK_SMTP_USER: ${KALPONIK_SMTP_USER:-}
      KALPONIK_SMTP_PASS: ${KALPONIK_SMTP_PASS:-}
      KALPONIK_SMTP_HOST: ${KALPONIK_SMTP_HOST:-smtp.gmail.com}
      KALPONIK_SMTP_PORT: ${KALPONIK_SMTP_PORT:-465}
      KALPONIK_MAIL_FROM: ${KALPONIK_MAIL_FROM:-}
      # Keeps the free Supabase project awake: one small database read a
      # minute after start, then every interval (src/libs/supabaseKeepAlive.ts).
      KALPONIK_KEEPALIVE: ${KALPONIK_KEEPALIVE:-on}
      KALPONIK_KEEPALIVE_INTERVAL_HOURS: ${KALPONIK_KEEPALIVE_INTERVAL_HOURS:-24}
      # The public shelf: total size of all public books, and the largest one
      # book may be. Public books don't count against anyone's own quota.
      KALPONIK_PUBLIC_SHELF_QUOTA_GB: ${KALPONIK_PUBLIC_SHELF_QUOTA_GB:-50}
      KALPONIK_PUBLIC_BOOK_MAX_MB: ${KALPONIK_PUBLIC_BOOK_MAX_MB:-300}
    depends_on:
      - garage
    networks:
      - default
      - proxy

  garage:
    image: dxflrs/garage:v2.5.0
    container_name: kalponik-garage
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:${KALPONIK_S3_PORT:-47812}:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET in .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in .env}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      # Metadata (small, sqlite) and book files (big; put them on a big disk).
      - ${GARAGE_META_DIR:-./data/garage-meta}:/var/lib/garage/meta
      - ${GARAGE_DATA_DIR:?set GARAGE_DATA_DIR in .env}:/var/lib/garage/data
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${NGINX_PROXY_NETWORK:?set NGINX_PROXY_NETWORK in .env (the reverse proxy container's network)}
