# Kalponik routes for the existing asroy.duckdns.org server block in nginx-proxy
# (on the server, nginx-proxy's hand-written config).
# Paste these inside the HTTPS `server { ... }` block, next to the other
# services' locations, then `nginx -t` and reload. Nothing else in the block
# changes.
#
# nginx-proxy reaches kalponik-web and kalponik-garage by container name over
# the shared `asroy` Docker network (NGINX_PROXY_NETWORK in .env). Upstreams
# are set through a variable + Docker's resolver, like /files, so nginx still
# starts (and the weekly certbot restart still works) when a Kalponik
# container is down. With a variable and no URI in proxy_pass, nginx forwards
# the request URI exactly as the client sent it.
#
# `auth_basic off` keeps the homepage's basic auth off these routes.

# --- Book storage (Garage S3) --------------------------------------------------
# The bucket name IS the path. The web app signs S3 URLs path-style against
# https://asroy.duckdns.org/<bucket>/<key>, and the signature covers the Host
# header and the path, so forward the path untouched and keep the original Host.
location /kalponik-books/ {
    auth_basic off;
    resolver 127.0.0.11 valid=30s;
    set $kalponik_s3 kalponik-garage:3900;
    proxy_pass http://$kalponik_s3;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    chunked_transfer_encoding off;
}

# --- Web app (Next.js, built with basePath /kalponik) ---------------------------
# The path is passed through unchanged; the app expects the /kalponik prefix.
# `/kalponik` (no slash) must reach the app too: Next.js redirects
# /kalponik/ -> /kalponik, so an nginx redirect the other way loops.
# (/kalponik-books/ is a longer prefix, so it still wins for book files.)
location /kalponik {
    auth_basic off;
    resolver 127.0.0.11 valid=30s;
    set $kalponik_web kalponik-web:3000;
    proxy_pass http://$kalponik_web;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
}
