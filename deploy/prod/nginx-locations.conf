# Kalponik routes for the existing asroy.duckdns.org server block in nginx-proxy.
# Paste these inside that `server { ... }` block (the HTTPS one), next to the
# other services' locations, then `nginx -t` and reload. Nothing else in the
# block changes.
#
# Assumes nginx-proxy shares a Docker network with kalponik-web and
# kalponik-garage (NGINX_PROXY_NETWORK in .env). If it reaches services some
# other way, swap the two upstream hosts for whatever it uses.

# --- Book storage (Garage S3) --------------------------------------------------
# The bucket name IS the path. The web app signs S3 URLs path-style against
# https://asroy.duckdns.org/<bucket>/<key>, and the signature covers the Host
# header and the path, so forward the path untouched (proxy_pass with no URI)
# and keep the original Host.
location /kalponik-books/ {
    proxy_pass http://kalponik-garage:3900;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    chunked_transfer_encoding off;
}

# --- Web app (Next.js, built with basePath /kalponik) ---------------------------
# The path is passed through unchanged; the app expects the /kalponik prefix.
location /kalponik/ {
    proxy_pass http://kalponik-web:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
}

location = /kalponik {
    return 301 /kalponik/;
}
