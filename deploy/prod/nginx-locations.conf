# Kalponik routes for an nginx reverse proxy running in Docker.
# Paste these inside the HTTPS `server { ... }` block for your domain, then
# `nginx -t` and reload. Nothing else in the block has to change.
#
# nginx reaches kalponik-web and kalponik-garage by container name over the
# shared Docker network (NGINX_PROXY_NETWORK in .env). Upstreams are set
# through a variable + Docker's resolver, so nginx still starts when a
# Kalponik container is down. With a variable and no URI in proxy_pass, nginx
# forwards the request URI exactly as the client sent it.
#
# If nginx runs on the host instead of in Docker, drop the resolver/set lines
# and use proxy_pass http://127.0.0.1:47812; and http://127.0.0.1:47811;
# (KALPONIK_S3_PORT / KALPONIK_WEB_PORT) without a URI.
#
# `auth_basic off` matters only if the server block has basic auth on.

# --- Book storage (Garage S3) --------------------------------------------------
# The bucket name IS the path. The web app signs S3 URLs path-style against
# https://example.com/<bucket>/<key>, and the signature covers the Host
# header and the path, so forward the path untouched and keep the original Host.
location /kalponik-books/ {
    auth_basic off;
    resolver 127.0.0.11 valid=30s;
    set $kalponik_s3 kalponik-garage:3900;
    proxy_pass http://$kalponik_s3;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1g;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_connect_timeout 300;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    chunked_transfer_encoding off;
}

# --- Web app (Next.js, built with basePath /kalponik) ---------------------------
# The path is passed through unchanged; the app expects the /kalponik prefix.
# `/kalponik` (no slash) must reach the app too: Next.js redirects
# /kalponik/ -> /kalponik, so an nginx redirect the other way loops.
# (/kalponik-books/ is a longer prefix, so it still wins for book files.)
location /kalponik {
    auth_basic off;
    resolver 127.0.0.11 valid=30s;
    set $kalponik_web kalponik-web:3000;
    proxy_pass http://$kalponik_web;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 64m;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300;
}
